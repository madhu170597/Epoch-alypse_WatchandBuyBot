[project]
name = "mandateguard"
version = "0.3.0"
description = "MandateGuard: deterministic-first governance service for AP2 agent payments (rule packs -> Gemini tighten-only checks -> signed hash-chained decision records)"
requires-python = ">=3.11"
dependencies = [
  # AP2 v0.2 SDK, pinned to the commit after the v0.2.0 release (2026-04-29).
  "ap2 @ git+https://github.com/google-agentic-commerce/AP2.git@e1ea56d",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6",
  "cel-python>=0.5.0",
  "rfc8785>=0.1.4",
  "rapidfuzz>=3.9",
  "tldextract>=5.1",
  "jwcrypto>=1.5",
  "cryptography>=43",
  "httpx>=0.27",
  "google-genai>=1.51",
  "google-cloud-modelarmor>=0.7",
  "google-cloud-firestore>=2.19",
  "google-cloud-kms>=3.0",
  "google-auth>=2.30",
  "google-cloud-storage>=2.18",
  # 2.x: 3.x needs cryptography>=49, but the AP2 SDK pins cryptography==46.0.5
  "webauthn>=2.5,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "qrcode>=7.4"]  # qrcode: scannable links in the demo

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mandateguard = ["packs/*.yaml", "packs/*.json", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
