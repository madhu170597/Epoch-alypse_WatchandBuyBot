[project]
name = "telegram-bot"
version = "0.1.0"
description = "Telegram channel for the agentic ordering bot: account linking, chat relay, approvals"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.120.2",
    "uvicorn==0.38.0",
    "httpx==0.28.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "google-auth==2.41.1",
    "cryptography==46.0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
